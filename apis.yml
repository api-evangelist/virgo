name: Virgo
description: >-
  Virgo builds AI foundation models for gastrointestinal (GI) endoscopy,
  targeting gut-mediated diseases such as inflammatory bowel disease and
  colorectal cancer. Its flagship model, EndoDINO, was trained on the largest
  known endoscopy dataset (130,037 videos / ~3.5 billion frames), and EndoML is
  the GI-specific tooling environment for building clinical and research
  workflows on top of it. Virgo Cloud provides video capture and management for
  endoscopy procedures, while Virgo Trials accelerates clinical trials with
  automatic data capture, endoscopic scoring, placebo-response prediction,
  subgroup identification, and AI biomarker discovery. The company was surfaced
  as a Techstars portfolio company and added to the API Evangelist network.
